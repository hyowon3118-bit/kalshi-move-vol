# 입력: fixers26-1research에서 정제한 Kalshi 분포 (DKW 방식). 이 repo 기준 상대경로 또는 절대경로
source_repo: "../fixers26-1research"

series: [KXCPI, KXCPICORE, KXGDP, KXPAYROLLS, KXU3]

daily:
  min_volume: 0            # 그날 Kalshi 거래량이 이 값 초과인 날만 쓰는 강건성 분석 (0 → 거래 있는 날만)
  max_days_to_expiry: 30   # 원 정제 설정과 같음 (만기 30일 전부터 분포 존재)

event_level:
  horizons: [7, 1]         # 만기 h일 전 분포로 이벤트 단위 상관
  max_stale_days: 3        # h일 전 이하에서 가장 가까운 관측이 이보다 오래되면 제외

move:
  start: "2021-12-01"

# 국채선물 실현변동성 (Databento). 04_databento_treasury.py는 비용 조회 후 budget_usd 이하일 때만 다운로드를 1번 호출
databento:
  dataset: "GLBX.MDP3"           # CME Globex
  symbols: ["ZT.v.0", "ZN.v.0"]  # 2년물·10년물 선물, 거래량 기준 연속 근월물
  stype_in: "continuous"
  schema: "ohlcv-1m"
  start: "2022-11-01"            # Kalshi 분포 시작(2022-12)보다 한 달 앞
  end: "2026-11-07"
  budget_usd: 125
  out_file: "data/raw/glbx_treasury_ohlcv1m.dbn.zst"

# 추가 종속변수 (꼬리 가설용): S&P500 선물(ES), 3개월 SOFR 선물(SR3, 연준 금리 경로 기대)
databento_extra:
  dataset: "GLBX.MDP3"
  symbols: ["ES.v.0", "SR3.v.0"]
  stype_in: "continuous"
  schema: "ohlcv-1m"
  start: "2022-11-01"
  end: "2026-11-07"
  budget_usd: 60
  out_file: "data/raw/glbx_extra_ohlcv1m.dbn.zst"

rv:
  bar_minutes: 5                 # Liu, Patton & Sheppard (2015): 5분 RV를 이기기 어렵다
  session_end_ct: "16:00"        # CME 거래일: 시카고 시간 전날 17:00 ~ 당일 16:00 ※
  max_empty_share: 0.5           # 거래 없는 5분 구간이 이 비율 초과인 날은 결측 ※
  pre_days: 5                    # 이벤트 분석에서 발표 전 평상시 변동성 통제용 (직전 5거래일 평균 RV) ※
